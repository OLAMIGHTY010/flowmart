name: Continuous Integration

on:
  push:
    branches: [ main, master, 'feat/*' ]
  pull_request:
    branches: [ main, master, 'feat/*' ]

jobs:
  typecheck-and-build:
    name: Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Dependencies
        run: |
          npm --prefix backend install
          npm --prefix frontend install
          npm --prefix frontend-admin install

      - name: Type Check Backend
        run: cd backend && npx tsc --noEmit

      - name: Build Frontend Storefront
        run: npm --prefix frontend run build

      - name: Build Frontend Admin Dashboard
        run: npm --prefix frontend-admin run build

  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Backend Dependencies
        run: npm --prefix backend install

      - name: Run Backend Unit & Middleware Tests
        run: cd backend && npx jest src/tests/middleware/

  e2e-tests:
    name: Frontend E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm --prefix frontend install

      - name: Install Playwright Browsers
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: npm --prefix frontend run test:e2e
